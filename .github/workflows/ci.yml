name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # Superseded PR pushes are cancelled; every pushed commit keeps its own result.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 26
                  cache: npm

            - id: install
              run: npm ci

            # Each check runs even when an earlier one failed, so one run reports every problem.
            - name: Format
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: npm run format:check

            - name: Typecheck
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: npm run typecheck

            # Without a client extract (WOW_CLIENT_DIR) the suites that read game data skip.
            - name: Test
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: npm test

            - name: Build
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: npm run build
